  var UNITS = [];
  QS.forEach(function (q) {
    var u = UNITS.filter(function (x) { return x.n === q.unit_number; })[0];
    if (!u) { u = { n: q.unit_number, name: q.unit_name, qs: [] }; UNITS.push(u); }
    u.qs.push(q);
  });
  UNITS.sort(function (a, b) { return a.n - b.n; });

  var MOCK_N = Math.min(50, QS.length);
  var MARK = 2;
  var NEG = 0.4;
  var KEY = 'anes-mcq-v1';
  var LETTERS = ['A', 'B', 'C', 'D'];

  /* ---------- saved progress (this browser only) ---------- */
  var store = { results: {}, mocks: [] };
  function loadStore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          store.results = p.results && typeof p.results === 'object' ? p.results : {};
          store.mocks = Array.isArray(p.mocks) ? p.mocks : [];
        }
      }
    } catch (e) { /* storage unavailable: run without saving */ }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
  }
  loadStore();

  /* ---------- helpers ---------- */
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); }
    else if (c.nodeType) { el.appendChild(c); }
    else { el.appendChild(document.createTextNode(String(c))); }
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmtTime(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function fmtScore(n) { return String(Math.round(n * 10) / 10); }

  function flow(p0, size, now, max, label) {
    var ball = h('span', { class: 'ball' });
    var t = h('div', {
      class: 'tube ' + size, role: 'progressbar',
      'aria-valuemin': '0', 'aria-valuemax': String(max), 'aria-valuenow': String(now), 'aria-label': label
    }, ball);
    t.style.setProperty('--p', p0);
    return t;
  }
  function setFlow(t, p) { t.style.setProperty('--p', p); }
  function later(fn) { requestAnimationFrame(function () { requestAnimationFrame(fn); }); }

  /* ---------- state ---------- */
  var S = { view: 'home' };
  var app = document.getElementById('app');
  var timer = null;
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function elapsed() { return Math.floor((Date.now() - S.start) / 1000); }
  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      var c = document.getElementById('clock');
      if (c) c.textContent = fmtTime(elapsed());
    }, 1000);
  }

  function render(keep) {
    var y = window.scrollY;
    var node = S.view === 'home' ? homeView() : S.view === 'quiz' ? quizView() : resultView();
    app.replaceChildren(node);
    window.scrollTo(0, keep ? y : 0);
  }

  function goHome() { stopTimer(); S = { view: 'home' }; render(); }

  function startQuiz(opts) {
    S = {
      view: 'quiz', mode: opts.mode, qs: opts.qs, title: opts.title,
      idx: 0, answers: {}, start: Date.now(), lastP: 0
    };
    render();
    if (S.mode === 'mock') startTimer(); else stopTimer();
  }

  /* ---------- modal ---------- */
  function openModal(build) {
    var prev = document.activeElement;
    var scrim = h('div', { class: 'scrim' });
    var dlg = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-title', tabindex: '-1' });
    function close() {
      document.removeEventListener('keydown', onKey, true);
      scrim.remove();
      if (prev && prev.focus && document.contains(prev)) prev.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
      if (e.key === 'Tab') {
        var f = dlg.querySelectorAll('button:not([disabled])');
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    append(dlg, build(close));
    scrim.appendChild(dlg);
    document.body.appendChild(scrim);
    document.addEventListener('keydown', onKey, true);
    dlg.focus();
  }
  function confirmModal(title, text, yesLabel, onYes, noLabel) {
    openModal(function (close) {
      return [
        h('h2', { id: 'dlg-title' }, title),
        h('p', { class: 'muted' }, text),
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn', onclick: close }, noLabel || 'Cancel'),
          h('button', { class: 'btn primary', onclick: function () { close(); onYes(); } }, yesLabel))
      ];
    });
  }

  /* ---------- home ---------- */
  function homeView() {
    stopTimer();
    var R = store.results;
    var mastered = QS.filter(function (q) { return R[q.id] === 1; }).length;
    var missed = QS.filter(function (q) { return R[q.id] === 0; });
    var tube = flow(0, 'big', mastered, QS.length, 'Questions answered correctly');
    later(function () { setFlow(tube, QS.length ? mastered / QS.length : 0); });

    var actions = h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: function () {
        startQuiz({ mode: 'mock', qs: shuffle(QS.slice()).slice(0, MOCK_N), title: 'Mock test' });
      } }, 'Start mock test (' + MOCK_N + ' questions)'),
      h('button', { class: 'btn', onclick: function () {
        startQuiz({ mode: 'practice', qs: shuffle(QS.slice()), title: 'All questions' });
      } }, 'Practice all ' + QS.length),
      missed.length ? h('button', { class: 'btn', onclick: function () {
        startQuiz({ mode: 'practice', qs: shuffle(missed.slice()), title: 'Missed questions' });
      } }, 'Redo ' + missed.length + ' missed') : null
    );

    var unitRows = UNITS.map(function (u) {
      var tried = u.qs.filter(function (q) { return q.id in R; }).length;
      var good = u.qs.filter(function (q) { return R[q.id] === 1; }).length;
      var pips = h('span', { class: 'pips', 'aria-hidden': 'true' }, u.qs.map(function (q) {
        return h('span', { class: 'pip' + (R[q.id] === 1 ? ' g' : R[q.id] === 0 ? ' b' : '') });
      }));
      return h('button', { class: 'unit', onclick: function () {
        startQuiz({ mode: 'practice', qs: u.qs.slice(), title: u.name });
      } },
        h('span', { class: 'un' }, String(u.n)),
        h('span', { class: 'uname' }, u.name),
        h('span', { class: 'ustat' }, pips, tried ? good + ' of ' + u.qs.length + ' correct' : u.qs.length + ' questions')
      );
    });

    var mocks = store.mocks.slice(0, 5);
    var hasData = Object.keys(R).length || store.mocks.length;

    return h('main', { class: 'wrap' },
      h('section', { class: 'hero' },
        h('h1', null, 'Anesthesia Assistant'),
        h('p', { class: 'ne', lang: 'ne' }, 'एनेस्थेसिया सहायक, सहायक पाँचौ तह'),
        h('p', { class: 'lede' }, 'Practice for the Gandaki Pradesh Lok Sewa Aayog written exam. The real paper has 50 MCQs worth 2 marks each, and every wrong answer costs 0.4 marks.'),
        h('div', { class: 'gauge' }, tube,
          h('p', { class: 'gauge-note' }, mastered + ' of ' + QS.length + ' questions answered correctly on your last try')),
        actions
      ),
      h('section', null,
        h('h2', { class: 'sec' }, 'Practice by unit'),
        h('p', { class: 'sub' }, 'Each unit follows the official syllabus. You see the answer and explanation right after every question.'),
        h('div', { class: 'units' }, unitRows)
      ),
      mocks.length ? h('section', null,
        h('h2', { class: 'sec' }, 'Recent mock tests'),
        h('ul', { class: 'mocks' }, mocks.map(function (m) {
          return h('li', null,
            h('span', null, new Date(m.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })),
            h('span', null, fmtScore(m.score) + ' of ' + (m.n * MARK) + ' marks'),
            h('span', null, fmtTime(m.secs)));
        }))
      ) : null,
      h('p', { class: 'foot' },
        'Unofficial practice material. Check drug doses and values against your textbook and the official syllabus. Your progress is saved only in this browser.',
        hasData ? h('span', null, ' ', h('button', { class: 'linkbtn', onclick: function () {
          confirmModal('Clear saved progress?', 'This removes your question history and mock test scores from this browser.', 'Clear progress', function () {
            store = { results: {}, mocks: [] }; saveStore(); render(true);
          });
        } }, 'Clear saved progress')) : null
      )
    );
  }

  /* ---------- quiz ---------- */
  function choose(letter) {
    var q = S.qs[S.idx];
    if (S.mode === 'practice') {
      if (S.answers[q.id]) return;
      S.answers[q.id] = letter;
      store.results[q.id] = letter === q.correct_answer ? 1 : 0;
      saveStore();
      render(true);
      var w = document.querySelector('.why');
      if (w) { w.focus({ preventScroll: true }); w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    } else {
      if (S.answers[q.id] === letter) delete S.answers[q.id]; else S.answers[q.id] = letter;
      render(true);
      var b = document.querySelector('.opt[data-l="' + letter + '"]');
      if (b) b.focus({ preventScroll: true });
    }
  }
  function next() {
    var q = S.qs[S.idx];
    if (S.mode === 'practice' && !S.answers[q.id]) return;
    if (S.idx < S.qs.length - 1) { S.idx++; render(); }
    else if (S.mode === 'practice') { finishPractice(); }
    else { openList(); }
  }
  function prev() { if (S.mode === 'mock' && S.idx > 0) { S.idx--; render(); } }
  function exitQuiz() {
    if (S.mode === 'mock' && Object.keys(S.answers).length) {
      confirmModal('Leave this test?', 'Your answers will not be scored or saved.', 'Leave test', goHome, 'Keep going');
    } else { goHome(); }
  }
  function openList() {
    openModal(function (close) {
      var n = S.qs.length;
      var answered = Object.keys(S.answers).length;
      var cells = S.qs.map(function (qq, i) {
        var done = !!S.answers[qq.id];
        return h('button', {
          class: 'cell' + (done ? ' done' : '') + (i === S.idx ? ' cur' : ''),
          'aria-label': 'Question ' + (i + 1) + (done ? ', answered' : ', not answered') + (i === S.idx ? ', current' : ''),
          onclick: function () { close(); S.idx = i; render(); }
        }, String(i + 1));
      });
      var left = n - answered;
      return [
        h('h2', { id: 'dlg-title' }, 'Question list'),
        h('p', { class: 'muted' }, answered + ' of ' + n + ' answered. Filled numbers are answered.' +
          (left ? ' Unanswered questions score 0 and lose no marks.' : '')),
        h('div', { class: 'grid' }, cells),
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn', onclick: close }, 'Back to test'),
          h('button', { class: 'btn primary', onclick: function () { close(); finishMock(); } }, 'Submit test'))
      ];
    });
  }

  function quizView() {
    var q = S.qs[S.idx], n = S.qs.length, mock = S.mode === 'mock';
    var ans = S.answers[q.id];
    var lock = !mock && !!ans;
    var p = (S.idx + 1) / n;
    var tube = flow(S.lastP, 'sm', S.idx + 1, n, 'Question progress');
    var startP = S.lastP;
    S.lastP = p;
    if (startP !== p) later(function () { setFlow(tube, p); }); else setFlow(tube, p);

    var opts = LETTERS.map(function (L) {
      var cls = 'opt', tag = null;
      if (lock) {
        if (L === q.correct_answer) { cls += ' right'; tag = L === ans ? 'Your answer, correct' : 'Correct answer'; }
        else if (L === ans) { cls += ' wrong'; tag = 'Your answer'; }
      }
      var props = { class: cls, type: 'button', 'data-l': L, onclick: function () { choose(L); } };
      if (mock) props['aria-pressed'] = ans === L ? 'true' : 'false';
      if (lock) props['aria-disabled'] = 'true';
      return h('button', props,
        h('span', { class: 'ltr' }, L),
        h('span', null, q.options[L], tag ? h('span', { class: 'tag' }, tag) : null));
    });

    var why = null;
    if (lock) {
      var ok = ans === q.correct_answer;
      why = h('div', { class: 'why ' + (ok ? 'ok' : 'no'), tabindex: '-1', role: 'status' },
        h('p', { class: 'verdict' }, ok ? 'Correct.' : 'Not quite. The correct answer is ' + q.correct_answer + '.'),
        h('p', null, q.explanation));
    }

    var navBtns;
    if (mock) {
      var answered = Object.keys(S.answers).length;
      navBtns = [
        h('button', { class: 'btn', onclick: prev, disabled: S.idx === 0 }, 'Previous'),
        h('button', { class: 'ghost mid', onclick: openList }, 'Question list (' + answered + '/' + n + ')'),
        h('button', { class: 'btn primary', onclick: next }, S.idx === n - 1 ? 'Review and submit' : 'Next')
      ];
    } else {
      navBtns = [
        h('button', { class: 'btn primary end', onclick: next, disabled: !ans },
          S.idx === n - 1 ? 'See results' : 'Next question')
      ];
    }

    return h('div', { class: 'shell' },
      h('header', { class: 'bar' }, h('div', { class: 'wrap row' },
        h('button', { class: 'ghost', onclick: exitQuiz }, 'Exit'),
        tube,
        h('span', { class: 'count' }, (S.idx + 1) + ' / ' + n),
        mock ? h('span', { class: 'clock', id: 'clock', 'aria-label': 'Time elapsed' }, fmtTime(elapsed())) : null
      )),
      h('main', { class: 'wrap' },
        h('p', { class: 'qmeta' }, 'Unit ' + q.unit_number + ': ' + q.unit_name),
        h('h1', { class: 'qtext' }, q.question),
        h('div', { class: 'opts' }, opts),
        mock ? h('p', { class: 'hint' }, 'Tap your answer again to clear it. Answers are scored when you submit.') : null,
        why
      ),
      h('nav', { class: 'nav', 'aria-label': 'Question navigation' }, h('div', { class: 'wrap' }, navBtns))
    );
  }

  /* ---------- results ---------- */
  function summarize() {
    var c = 0, w = 0, s = 0, per = {};
    S.qs.forEach(function (q) {
      var a = S.answers[q.id];
      var u = per[q.unit_number] || (per[q.unit_number] = { name: q.unit_name, c: 0, w: 0, s: 0 });
      if (!a) { s++; u.s++; }
      else if (a === q.correct_answer) { c++; u.c++; }
      else { w++; u.w++; }
    });
    return { c: c, w: w, s: s, per: per };
  }
  function finishMock() {
    stopTimer();
    var r = summarize();
    S.secs = elapsed();
    S.qs.forEach(function (q) {
      var a = S.answers[q.id];
      if (a) store.results[q.id] = a === q.correct_answer ? 1 : 0;
    });
    store.mocks.unshift({
      t: Date.now(), score: Math.round((r.c * MARK - r.w * NEG) * 10) / 10,
      c: r.c, w: r.w, s: r.s, n: S.qs.length, secs: S.secs
    });
    store.mocks = store.mocks.slice(0, 10);
    saveStore();
    S.view = 'result'; S.filter = 'all'; render();
  }
  function finishPractice() {
    S.secs = elapsed();
    S.view = 'result'; S.filter = 'all'; render();
  }

  function resultView() {
    var r = summarize(), n = S.qs.length, mock = S.mode === 'mock';
    var missed = S.qs.filter(function (q) { return S.answers[q.id] && S.answers[q.id] !== q.correct_answer; });

    var head;
    if (mock) {
      var score = r.c * MARK - r.w * NEG;
      head = [
        h('h1', null, 'Mock test result'),
        h('p', null, h('span', { class: 'score' }, fmtScore(score)), h('span', { class: 'of' }, 'out of ' + (n * MARK) + ' marks')),
        h('p', { class: 'math' },
          r.c + ' correct earn ' + (r.c * MARK) + ' marks. ' + r.w + ' wrong cost ' + fmtScore(r.w * NEG) + ' marks. ' +
          r.s + ' skipped score 0. Time taken: ' + fmtTime(S.secs) + '.')
      ];
    } else {
      head = [
        h('h1', null, S.title),
        h('p', null, h('span', { class: 'score' }, String(r.c)), h('span', { class: 'of' }, 'of ' + n + ' correct')),
        h('p', { class: 'math' }, 'Practice mode has no negative marking. Review the explanations below, especially the ones you missed.')
      ];
    }

    var split = h('div', { class: 'split', role: 'img', 'aria-label': r.c + ' correct, ' + r.w + ' wrong, ' + r.s + ' skipped' },
      h('span', { class: 's-c', style: 'width:' + (r.c / n * 100) + '%' }),
      h('span', { class: 's-w', style: 'width:' + (r.w / n * 100) + '%' }),
      h('span', { class: 's-s', style: 'width:' + (r.s / n * 100) + '%' }));
    var legend = h('div', { class: 'legend' },
      h('span', { class: 'lc' }, r.c + ' correct'),
      h('span', { class: 'lw' }, r.w + ' wrong'),
      h('span', { class: 'ls' }, r.s + ' skipped'));

    var unitKeys = Object.keys(r.per).map(Number).sort(function (a, b) { return a - b; });
    var table = h('div', { class: 'tblbox' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', null, 'Unit'), h('th', null, 'Correct'), h('th', null, 'Wrong'), h('th', null, 'Skipped'))),
      h('tbody', null, unitKeys.map(function (k) {
        var u = r.per[k];
        return h('tr', null, h('td', null, k + '. ' + u.name), h('td', null, String(u.c)), h('td', null, String(u.w)), h('td', null, String(u.s)));
      }))));

    var list = h('div', { 'aria-live': 'polite' });
    var tabsEl = h('div', { class: 'tabs' });
    function drawReview() {
      tabsEl.replaceChildren.apply(tabsEl, [['all', 'All ' + n], ['wrong', 'Wrong ' + r.w], ['skipped', 'Skipped ' + r.s]].map(function (t) {
        return h('button', { class: 'tab', 'aria-pressed': S.filter === t[0] ? 'true' : 'false', onclick: function () { S.filter = t[0]; drawReview(); } }, t[1]);
      }));
      var items = [];
      S.qs.forEach(function (q, i) {
        var a = S.answers[q.id];
        var st = !a ? 'skipped' : a === q.correct_answer ? 'correct' : 'wrong';
        if (S.filter !== 'all' && S.filter !== st) return;
        items.push(h('article', { class: 'rev ' + st },
          h('p', { class: 'rev-h' }, 'Question ' + (i + 1) + ', unit ' + q.unit_number + ', ' + st),
          h('h3', null, q.question),
          h('p', { class: 'ans' }, a ? 'Your answer: ' + a + '. ' + q.options[a] : 'You skipped this question.'),
          st !== 'correct' ? h('p', { class: 'ans key' }, 'Correct answer: ' + q.correct_answer + '. ' + q.options[q.correct_answer]) : null,
          h('p', { class: 'expl' }, q.explanation)));
      });
      list.replaceChildren.apply(list, items.length ? items : [h('p', { class: 'empty' }, 'Nothing to show here.')]);
    }
    drawReview();

    return h('main', { class: 'wrap res' },
      head, split, legend,
      h('h2', { class: 'sec' }, 'By unit'), table,
      h('h2', { class: 'sec' }, 'Review with explanations'), tabsEl, list,
      h('div', { class: 'end-actions' },
        h('button', { class: 'btn primary', onclick: function () {
          if (mock) startQuiz({ mode: 'mock', qs: shuffle(QS.slice()).slice(0, MOCK_N), title: 'Mock test' });
          else startQuiz({ mode: 'practice', qs: shuffle(S.qs.slice()), title: S.title });
        } }, mock ? 'Take another mock test' : 'Practice again'),
        missed.length ? h('button', { class: 'btn', onclick: function () {
          startQuiz({ mode: 'practice', qs: shuffle(missed.slice()), title: 'Missed questions' });
        } }, 'Practice ' + missed.length + ' missed') : null,
        h('button', { class: 'btn', onclick: goHome }, 'Back to home'))
    );
  }

  /* ---------- keyboard shortcuts ---------- */
  document.addEventListener('keydown', function (e) {
    if (S.view !== 'quiz' || document.querySelector('.scrim') || e.ctrlKey || e.metaKey || e.altKey) return;
    var map = { A: 'A', B: 'B', C: 'C', D: 'D', '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
    var k = String(e.key).toUpperCase();
    if (map[k]) { choose(map[k]); }
    else if (e.key === 'ArrowRight') { next(); }
    else if (e.key === 'ArrowLeft') { prev(); }
  });

  render();
})();
</script>
</body>
</html>
